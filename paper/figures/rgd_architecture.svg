  <g font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#245b85">
    <rect x="112" y="622" width="75" height="34" rx="17" fill="#ffffff" stroke="#6ea4c8"/><text x="149" y="644" text-anchor="middle">LEFT</text>
    <rect x="193" y="622" width="75" height="34" rx="17" fill="#ffffff" stroke="#6ea4c8"/><text x="230" y="644" text-anchor="middle">IDLE</text>
    <rect x="274" y="622" width="75" height="34" rx="17" fill="#ffffff" stroke="#6ea4c8"/><text x="311" y="644" text-anchor="middle">RIGHT</text>
    <rect x="355" y="622" width="75" height="34" rx="17" fill="#ffffff" stroke="#6ea4c8"/><text x="392" y="644" text-anchor="middle">FASTER</text>
