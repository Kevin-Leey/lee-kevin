  <path d="M1078 672 L1103 672" fill="none" stroke="#d98a17" stroke-width="3" stroke-dasharray="8,7" marker-end="url(#arrowAmber)"/>
  <path d="M1345 658 C1380 640 1400 500 1408 330" fill="none" stroke="#d98a17" stroke-width="3" stroke-dasharray="8,7" marker-end="url(#arrowAmber)"/>

