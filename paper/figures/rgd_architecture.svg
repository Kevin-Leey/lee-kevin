  <rect x="169" y="258" width="17" height="7" rx="2" fill="#8ba1ad"/>
  <rect x="191" y="218" width="18" height="31" rx="4" fill="#5f6e75"/>
  <rect x="145" y="229" width="18" height="30" rx="4" fill="#78858b"/>
