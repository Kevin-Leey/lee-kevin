<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1152" viewBox="0 0 2048 1152">
  <defs>
    <marker id="arrowNavy" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#245b85"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#189d9a"/>
    </marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#d98a17"/>
    </marker>
    <marker id="arrowCoral" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#d66158"/>
    </marker>
    <style>
      .title{font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;letter-spacing:.4px;fill:#ffffff}
      .label{font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;fill:#26343e}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#3d4c56}
      .tiny{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#52616a}
      .eq{font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;fill:#26343e}
      .arrowLabel{font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:600;fill:#31434f}
      .outline{stroke:#35434d;stroke-width:2;vector-effect:non-scaling-stroke}
    </style>
  </defs>

  <!-- paper -->
