  <rect x="70" y="840" width="1908" height="46" rx="12" fill="#9da8b1"/>
  <rect x="70" y="874" width="1908" height="12" fill="#9da8b1"/>
  <text x="92" y="870" class="title">ASYNCHRONOUS CLOSED LOOP</text>

