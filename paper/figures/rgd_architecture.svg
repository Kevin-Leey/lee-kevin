  <path d="M135 198 L155 322 M220 198 L200 322" stroke="#a2a9ad" stroke-width="2"/>
  <path d="M177 201 L177 218 M177 229 L177 246 M177 257 L177 274 M177 285 L177 302" stroke="#ffffff" stroke-width="4" stroke-dasharray="6,6"/>
