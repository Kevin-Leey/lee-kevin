
############ Large language model config ############
LLM_PROVIDER: siliconflow
SILICONFLOW_API_KEY: 'sk-pnikjefqwrwttqeoahzbiufjdpqbbczmodxrllccomkzkqvh'
SILICONFLOW_CHAT_MODEL: 'Qwen/Qwen3-8B'
SILICONFLOW_BASE_URL: 'https://api.siliconflow.cn/v1'
SILICONFLOW_USE_ENV_PROXY: true
QWEN_TEMPERATURE: 0.0
QWEN_REQUEST_TIMEOUT_S: 60.0
QWEN_ENABLE_THINKING: false
LLM_FORCE_JSON_RESPONSE: true
LLM_STRICT_JSON_SCHEMA: false

asynchronous_slow_path:
  enable: true
  min_release_frames: 1
rgd_predicted_slow_latency_s: 1.7
rgd_predicted_slow_latency_source: siliconflow_qwen3_8b_median_calibration_20260807

OPENAI_API_TYPE: # 'openai' or 'azure'
# below are for Openai
OPENAI_KEY: # 'sk-xxxxxx' 
OPENAI_CHAT_MODEL: 'gpt-4-1106-preview' # Alternative models: 'gpt-3.5-turbo-16k-0613' (note: performance may vary)
# below are for Azure OAI service
AZURE_API_BASE: # https://xxxxxxx.openai.azure.com/
AZURE_API_VERSION: "2023-07-01-preview"
AZURE_API_KEY: #'xxxxxxx'
AZURE_CHAT_DEPLOY_NAME: # chat model deployment name
AZURE_EMBED_DEPLOY_NAME: # text embed model deployment name  

############### DiLu settings ############
reflection_module: False # True or False
few_shot_num: 3 # 0 for zero-shot
episodes_num: 3 # run episodes
memory_path: 'memories/20_mem'
result_folder: 'results'

############ Highway-env config ############
simulation_duration: 20 # step
vehicle_count: 15
other_vehicle_type: "highway_env.vehicle.behavior.IDMVehicle" #other types are: "highway_env.vehicle.behavior.DefensiveVehicle" or "highway_env.vehicle.behavior.AggressiveVehicle"
vehicles_density: 2.0

############### Frozen paper-facing runtime contract ############
# Runtime experiments merge these defaults with ``formal_protocol.yaml``.  Keep
# the transport and transfer settings here as a readable, credential-free
# mirror of the paper-facing contract.
LLM_MAX_ATTEMPTS: 4
LLM_RETRY_BACKOFF_S: 15.0
rgd_latency_safety_reserve_s: 0.0

slow_thinking:
  risk_calibration:
    enable: false

MULTI_LLM_MODELS:
  - provider: siliconflow
    model: Qwen/Qwen3-8B
    label: Qwen3-8B
    base_url: https://api.siliconflow.cn/v1
  - provider: siliconflow
    model: Qwen/Qwen2.5-7B-Instruct
    label: Qwen2.5-7B
    base_url: https://api.siliconflow.cn/v1
  - provider: siliconflow
    model: Qwen/Qwen3.5-4B
    label: Qwen3.5-4B
    base_url: https://api.siliconflow.cn/v1
  - provider: openai_compatible
    model: gpt-5.6-sol
    label: GPT-5.6-sol
    base_url: https://bizdecipher.com/v1

paper_evidence_protocol:
  transfer:
    table_label: Table VII
    added_delay_s: 0.0
    latency_safety_reserve_s: 0.0
