protocol_name: rgd_tvt_action_aligned_release_v13
protocol_version: 13
description: "Action-aligned release protocol. The v12 query gate and its locked floors are retained unchanged; v13 revalidates the opportunity and releases a delayed proposal only when its post-safety action improves the current recovery cost by a fixed margin."

tvt_submission_contract:
  manuscript: paper/main.tex
  compiled_pdf: paper/main.pdf
  bibliography: paper/references.bib
  main_environment: highway-v0
  calibration_seeds: 2000-2039
  development_seeds: 4000-4029
  main_seeds: 5000-5029
  comparator_calibration_seeds: 30-59
  latency_endpoint_seeds: 5000-5029
  latency_endpoint_status: paired_rgd_latency_sweep_paper_facing
  mechanism_evaluation_seeds: 6000-6019
  mechanism_cohort_status: locked_v13_mechanism_cohort_not_used_for_tuning
  mechanism_evaluation_method_version: action_aligned_release_gate_v13
  mechanism_evaluation_compatibility: v13_system_with_identifiable_gate_v12_query_signals
  component_validation_seeds: 3000-3029
  component_validation_status: legacy_v12_holdout_not_used_for_v13_selection
  diagnostic_only_seed_blocks: [60-66, 100-189, 1000-1029]
  diagnostic_only_policy: never_use_for_v12_gate_parameter_selection_or_confirmation
  comparator_trigger_calibration:
    seed_range: 30-59
    status: frozen_before_identifiable_gate_v12
    purpose: scheduled_trigger_frequency_only
    outcome_labels_used: false
    exposure_matching_claim: forbidden
    main_claim_uses: actual_query_count_and_query_cost_per_correction
  rgd_method_version: action_aligned_release_gate_v13
  query_gate_method_version: identifiable_gate_v12
  release_contract_version: action_cost_alignment_v2
  prior_paper_result_method_version: support_breadth_v11
  earlier_paper_result_method_version: raw_affordance_v10
  main_delay_s: 0.0
  main_delay_steps: 0
  formal_execution_contract: &v13_highway_execution
    environment: highway-v0
    episode_duration_s: 30
    policy_frequency_hz: 10
    simulation_frequency_hz: 10
    expected_policy_steps: 300
  slow_service_calibration:
    provider: siliconflow
    model: Qwen/Qwen3-8B
    calibration_date: 2026-08-07
    request_count: 5
    wall_latency_s: [1.207, 1.684, 1.572, 1.360, 1.790]
    median_wall_latency_s: 1.572
    locked_gate_prediction_s: 1.7
    selection_rule: nearest_conservative_predeclared_latency_stratum
  mechanism_source_groups: [always_fast, always_slow]
  mechanism_source_execution_contract: *v13_highway_execution
  fixed_query_delays_s: [0.7, 1.7, 2.7]
  ttc_delay_threshold: 0.208
  release_rollout:
    horizon_steps: 20
    gamma: 0.99
    corrective_margin: 0.02
    utility: discounted_normalized_reward_minus_collision_indicator
    effective_action_identity:
      - post_safety_discrete_command
      - post_bridge_target_speed
    branch_continuation: complete_fast_policy
    bootstrap_unit: simulator_seed
    bootstrap_draws: 20000
  release_validation:
    state_need_role: query_admission_only
    required_predicates:
      - current_legal_action
      - exact_action_domain_and_cost_provenance
      - absolute_feasibility_and_maneuver_support
      - corrective_recovery_headroom
      - contemporaneous_fast_action_distinctness
      - recovery_cost_margin
    audit_only_predicates: [state_need]
    failure_policy: fail_closed_to_contemporaneous_fast_action
  query_release_factorial:
    artifact: results/highway_result/formal_run/query_release_factorial
    analysis_artifact: results/highway_result/formal_run/query_release_factorial_analysis
    design: matched_five_arm_query_release_with_fast_only
    arms: [full, query_only, release_only, neither, fast_only]
    seed_contract: main_seeds
    seed_range: {start: 5000, end: 5029, count: 30}
    environment: highway-v0
    episodes_per_cell: 1
    proposal_source_group: rgd_fixed_policy
    candidate_source_policy: natural_rgd_issued
    latency_profile: frozen
    fixed_delay_steps: null
    execution_contract: *v13_highway_execution
    randomized_block_order: true
    bootstrap_unit: simulator_seed
    bootstrap_draws: 20000
    bootstrap_seed: 20260807
    inference:
      design: paired_within_simulator_seed
      binary_test: exact_mcnemar
      continuous_test: paired_sign_flip
      confidence_interval: paired_seed_bootstrap_95_percent
      primary_family: full_minus_fast_only_across_prespecified_metrics
      multiplicity: holm
