# PADriver Table-I reproduction contract. The three upstream repositories are
# retained verbatim under reproduction/<method>/official_repo. Their native
# tasks use different datasets or simulators, so each interface is adapted at
# the observation/action boundary to the PAD-Highway setting in PADriver Sec. 3.1.
external_method_reproduction:
  protocol_id: padriver_pad_highway_reproduction_20260810
  result_root: results/reproduce
  execution_status: complete_qwen3_8b_transfer_1hz_policy_10hz_physics
  source_setting:
    paper: "PADriver: Towards Personalized Autonomous Driving"
    arxiv: https://arxiv.org/abs/2505.05240
    source_location: "Sec. 3.1 (Basic Setting), Sec. 3.3, and Table 1"
    benchmark: PAD-Highway
    frequency_interpretation: "10 Hz denotes the simulator/data sampling frequency; policy_frequency remains the Highway-Env default of 1 Hz because Sec. 3.1 states that all nonlisted settings follow the default configuration."
    source_frequency_contract: "10 physics frames per 1 policy step; 300 physics frames and 30 policy decisions per 30-s episode"
    source_metric_scope: "Dis. and Spe. are aggregated over successful 30-s trajectories; Saf. and Kep. follow the same successful-trajectory reporting subset; Suc. is counted over 30 seeds."
  common_transfer_contract:
